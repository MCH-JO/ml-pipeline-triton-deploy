---
version: "2.35"
services:
  triton:
    image: nvcr.io/nvidia/tritonserver:21.10-py3
    container_name: tritonserver
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    volumes:
      - ./model_repository:/models
    command: [
      "tritonserver",
      "--model-repository=/models",
      # "--log-verbose=1",              # to debug
      "--model-control-mode=poll",
      "--repository-poll-secs=5",
    ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
  client:
    build:
      context: ..
      dockerfile: client/Dockerfile
    environment:
      TRITON_URL: triton:8000
      TRITON_MODEL: simple
      TRITON_INPUT: input
      TRITON_OUTPUT: output
    depends_on:
      - triton
